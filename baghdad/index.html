<style>
:root{--yellow:#f3c316;--red:#b8261d;--cobalt:#173f9e;--night:#0d1430;--white:#fbfaf5;--paper:#fbf6ea}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);font-family:"Readex Pro",system-ui,sans-serif;color:var(--white);
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;cursor:pointer;border:0}

/* ===== شاشة البداية ===== */
#intro{position:fixed;inset:0;display:grid;place-items:center;padding:20px;z-index:20;
  background:radial-gradient(ellipse at 50% 40%,rgba(13,20,48,.35),rgba(13,20,48,.88) 70%);transition:opacity .6s}
#intro.off{opacity:0;pointer-events:none}
.card{max-width:440px;width:100%;text-align:center}
.sign{position:relative;background:var(--cobalt);border-radius:10px;padding:22px 26px 18px;
  box-shadow:0 20px 40px -14px rgba(0,0,0,.7), inset 0 0 0 5px var(--white), inset 0 0 0 9px var(--cobalt)}
.sign i{position:absolute;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#9aa0a8 60%,#5d636b)}
.sign i:nth-child(1){top:14px;right:14px}.sign i:nth-child(2){top:14px;left:14px}.sign i:nth-child(3){bottom:14px;right:14px}.sign i:nth-child(4){bottom:14px;left:14px}
.sign h1{font-family:Lalezar,serif;font-weight:400;font-size:clamp(42px,12vw,62px);line-height:1.05;margin:0;color:var(--yellow);text-shadow:0 3px 0 rgba(0,0,0,.35)}
.sign p{margin:6px 0 0;font-weight:600;color:var(--white);font-size:15px;letter-spacing:.2px}
.lead{background:var(--paper);color:#2a1d14;border-radius:4px;padding:14px 18px;margin:22px 8px 0;font-size:16px;line-height:1.75;
  transform:rotate(-1deg);box-shadow:0 12px 22px -12px rgba(0,0,0,.7);position:relative}
.lead::before{content:"";position:absolute;top:-10px;left:50%;width:76px;height:20px;margin-left:-38px;background:rgba(243,195,22,.85);transform:rotate(2deg)}
.btns{display:grid;gap:10px;margin-top:22px}
.btn{font-size:18px;font-weight:700;padding:15px 18px;border-radius:12px;background:var(--yellow);color:#1d1a2b;
  box-shadow:0 5px 0 #a8860c;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a8860c}
.btn.ghost{background:var(--white);box-shadow:0 5px 0 #b9b4a6}
.hint{margin-top:14px;font-size:13px;color:#c9cfe6;line-height:1.6}
.back{display:inline-block;margin-top:14px;color:#c9cfe6;font-size:14px;text-decoration:none;border-bottom:1px dashed #7d86a8}
#loading{margin-top:18px;font-size:14px;color:var(--yellow)}

/* ===== الواجهة وقت المشي ===== */
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding:max(12px,env(safe-area-inset-top)) 12px 0;z-index:10;pointer-events:none;opacity:0;transition:opacity .5s}
#hud.on{opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:7px;background:rgba(13,20,48,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  color:var(--white);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600;text-decoration:none}
.chip svg{width:17px;height:17px}
.chip.on{background:var(--yellow);color:#1d1a2b;border-color:var(--yellow)}
#stops b{color:var(--yellow)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#radio{width:212px;background:#3a2414;border-radius:12px;padding:8px;pointer-events:auto;box-shadow:0 10px 22px -8px rgba(0,0,0,.7),inset 0 0 0 2px #6b4020}
.rtop{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--yellow);margin:0 2px 6px}
.rdot{width:8px;height:8px;border-radius:50%;background:#5d636b}
#radio.play .rdot{background:#4ade80;box-shadow:0 0 8px #4ade80}
.rscreen{position:relative;width:196px;height:110px;border-radius:6px;overflow:hidden;background:#120b06}
.rscreen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#rMsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:12px;color:#e9dcc4;padding:8px;line-height:1.5}
.rbtns{display:flex;gap:6px;margin-top:6px}
.rbtns button{flex:1;background:var(--paper);color:#2a1d14;font-size:12px;font-weight:700;padding:7px 4px;border-radius:8px}
#radio.off .rscreen,#radio.off .rbtns{display:none}
#map{width:110px;height:150px;border-radius:10px;background:rgba(13,20,48,.72);border:1px solid rgba(255,255,255,.16);pointer-events:none}

#nano{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translate(-50%,140%);width:min(560px,calc(100% - 24px));
  display:flex;gap:12px;align-items:flex-start;background:var(--paper);color:#2a1d14;border-radius:16px;padding:14px 14px 14px 16px;z-index:12;
  box-shadow:0 18px 40px -10px rgba(0,0,0,.7);transition:transform .45s cubic-bezier(.2,.9,.3,1.2)}
#nano.on{transform:translate(-50%,0)}
.head{flex:0 0 54px;height:48px;background:#fff;border-radius:16px;position:relative;box-shadow:inset 0 -4px 0 #dfe3ee,0 4px 10px rgba(23,63,158,.3);margin-top:2px}
.head::before{content:"";position:absolute;top:-9px;left:50%;width:4px;height:9px;margin-left:-2px;background:#9aa3bd}
.head::after{content:"";position:absolute;top:-14px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--red)}
.eyes{position:absolute;top:14px;left:0;right:0;display:flex;justify-content:center;gap:12px}
.eyes i{width:9px;height:12px;border-radius:5px;background:var(--cobalt);animation:blink 4s infinite}
.mouth{position:absolute;bottom:9px;left:50%;width:16px;height:4px;margin-left:-8px;border-radius:3px;background:var(--cobalt)}
#nano.talk .mouth{animation:talk .22s infinite alternate}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes talk{to{height:9px;bottom:7px;border-radius:0 0 8px 8px}}
.say{flex:1;min-width:0}
.say h3{margin:0 0 3px;font-size:13px;color:var(--red);font-weight:700}
.say p{margin:0;font-size:16px;line-height:1.75;min-height:2em}
#skip{flex:0 0 auto;align-self:flex-end;background:#1d1a2b;color:var(--yellow);font-size:13px;font-weight:700;padding:7px 12px;border-radius:9px}

#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;z-index:9;pointer-events:none;
  background:rgba(251,250,245,.12);border:2px solid rgba(251,250,245,.35);display:none}
#joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(243,195,22,.85);box-shadow:0 4px 12px rgba(0,0,0,.4)}
#tip{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:8;font-size:13px;color:#e4e8f6;
  background:rgba(13,20,48,.6);padding:7px 14px;border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .5s;pointer-events:none}
#tip.on{opacity:1}
#end{position:fixed;inset:0;display:grid;place-items:center;padding:20px;z-index:15;background:rgba(13,20,48,.7);opacity:0;pointer-events:none;transition:opacity .6s}
#end.on{opacity:1;pointer-events:auto}
@media (max-width:520px){#radio{width:150px}.rscreen{width:134px;height:76px}.rbtns button{font-size:11px;padding:6px 2px}#map{width:80px;height:109px}.chip{padding:7px 11px;font-size:13px}.say p{font-size:15px;line-height:1.65}}
@media (prefers-reduced-motion:reduce){#nano{transition:none}.eyes i,#nano.talk .mouth{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="intro">
  <div class="card">
    <div class="sign"><i></i><i></i><i></i><i></i>
      <h1>بغداد القديمة</h1>
      <p>شارع الرشيد والمتنبي · بالليل</p>
    </div>
    <div class="lead">تمشّى بشارع الرشيد تحت الطاقات والشناشيل، لف لشارع الكتب، ووصل لدجلة. ونانو وياك يحچيلك حكاية كل مكان.</div>
    <div class="btns" id="startBtns" hidden>
      <button class="btn" id="goAuto">نانو يمشّيني</button>
      <button class="btn ghost" id="goFree">أمشي بروحي</button>
    </div>
    <div id="loading">دا نبني بغداد...</div>
    <div class="hint" id="hint"></div>
    <a class="back" href="/">← مشاريع ياسر عمر</a>
  </div>
</div>

<div id="hud">
  <div class="chips">
    <a class="chip" href="/" aria-label="رجوع لمشاريع ياسر عمر"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>رجوع</a>
    <span class="chip" id="stops">المحطات <b>0</b>/8</span>
    <button class="chip" id="autoBtn"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="13" cy="4" r="2"/><path d="M10.5 8.5l-3 2v4h2v-3l1.2-.8-1.7 9.3h2.1l1.2-5.5 2.2 2.2V22h2v-6.2l-2.3-2.3.7-3.2c1 1.2 2.4 1.9 4.1 1.9v-2c-1.4 0-2.5-.8-3.1-1.9l-1-1.7c-.5-.7-1.3-1.1-2.2-1L10.5 8.5z"/></svg>مشّيني</button>
    <button class="chip on" id="radioBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 8h16a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1zm12 3a3 3 0 100 6 3 3 0 000-6zM5 11v2h7v-2H5zm0 4v2h7v-2H5zM15 3.5L6 7h4.5l5.6-2.2z"/></svg>الراديو</button>
  </div>
  <div class="side">
    <canvas id="map" width="220" height="300"></canvas>
    <div id="radio">
      <div class="rtop"><span class="rdot"></span><b id="rName">راديو بغداد</b></div>
      <div class="rscreen"><div id="ytp"></div><span id="rMsg">دا نشغّل الراديو...</span></div>
      <div class="rbtns"><button id="rSta">محطة ثانية</button><button id="rNext">أغنية ثانية</button></div>
    </div>
  </div>
</div>

<div id="nano" aria-live="polite">
  <div class="head"><div class="eyes"><i></i><i></i></div><div class="mouth"></div></div>
  <div class="say"><h3 id="sayT">نانو</h3><p id="sayP"></p></div>
  <button id="skip">تخطّى</button>
</div>
<div id="joy"><i></i></div>
<div id="tip"></div>

<div id="end">
  <div class="card">
    <div class="sign"><i></i><i></i><i></i><i></i><h1>خلصت الجولة</h1><p>شفت بغداد القديمة بالليل</p></div>
    <div class="btns">
      <button class="btn" id="again">ارجع للبداية</button>
      <button class="btn ghost" id="stay">أكمل أتمشى</button>
    </div>
    <a class="back" href="/">← مشاريع ياسر عمر</a>
  </div>
</div>

<script type="module">
import * as THREE from "three";
const $ = id => document.getElementById(id);
const TOUCH = matchMedia("(pointer:coarse)").matches;
$("hint").textContent = TOUCH
  ? "حرّك الإبهام يسار الشاشة حتى تمشي، واسحب بمكان ثاني حتى تباوع."
  : "تمشي بالأسهم أو W A S D، وتسحب بالماوس حتى تباوع.";

/* أرقام عشوائية ثابتة حتى بغداد تطلع نفسها كل مرة */
let seed = 1916;
const rnd = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const R = (a, b) => a + rnd() * (b - a);
const pick = a => a[Math.floor(rnd() * a.length)];

await Promise.all(['400 60px Lalezar', '700 40px "Readex Pro"', '600 40px "Readex Pro"'].map(f => document.fonts.load(f).catch(() => {})));

/* ===== المشهد ===== */
const renderer = new THREE.WebGLRenderer({ canvas: $("c"), antialias: true, powerPreference: "high-performance", preserveDrawingBuffer: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, TOUCH ? 1.6 : 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
const scene = new THREE.Scene();
const SKY = 0x0d1430;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.FogExp2(SKY, 0.0125);
const fovFor = () => innerWidth / innerHeight < 1 ? 84 : 68;
const camera = new THREE.PerspectiveCamera(fovFor(), innerWidth / innerHeight, 0.1, 800);
camera.rotation.order = "YXZ";
scene.add(new THREE.HemisphereLight(0x6273b8, 0x3a2614, 1.1));
const moonL = new THREE.DirectionalLight(0xa9bdf0, 0.55); moonL.position.set(-60, 80, -40); scene.add(moonL);

const cv = (w, h, draw) => { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h); return c; };
const tex = (c, srgb = true) => { const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; };
const lam = o => new THREE.MeshLambertMaterial(o);
const BOX = new THREE.BoxGeometry(1, 1, 1);
const mtx = new THREE.Matrix4();
const add = (geo, mat, x, y, z, sx = 1, sy = 1, sz = 1, ry = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.scale.set(sx, sy, sz); m.rotation.y = ry; scene.add(m); return m; };

/* ===== الحيطان: طابوق وشبابيك مقوّسة ===== */
const WALLS = ["#c9a06a", "#b88752", "#d4b27f", "#c29a72", "#a97f55", "#cdb48e"];
function archWin(g, x, y, w, h, fill, plain) {
  g.beginPath(); g.moveTo(x, y + h); g.lineTo(x, y + w / 2); g.arc(x + w / 2, y + w / 2, w / 2, Math.PI, 0); g.lineTo(x + w, y + h); g.closePath();
  g.fillStyle = fill; g.fill();
  if (!plain) {
    g.strokeStyle = "rgba(245,230,200,.75)"; g.lineWidth = 4; g.stroke();
    g.strokeStyle = "rgba(40,25,10,.55)"; g.lineWidth = 2; g.beginPath();
    g.moveTo(x + w / 2, y + w / 2); g.lineTo(x + w / 2, y + h); g.moveTo(x, y + h * .58); g.lineTo(x + w, y + h * .58); g.stroke();
  }
}
function facade(i) {
  const base = WALLS[i % WALLS.length], lit = [];
  const floors = 3, top = 34, fh = (512 - top) / floors, ww = 46;
  const plan = [];
  for (let f = 0; f < floors; f++) for (let c = 0; c < 3; c++) plan.push([(256 / 3) * (c + .5) - ww / 2, top + f * fh + fh * .22, ww, fh * .6, rnd() < .4 ? pick(["#ffcf7a", "#ffd99a", "#ffb85c"]) : null]);
  const stains = [...Array(36)].map(() => [R(0, 256), R(0, 512), R(10, 60), R(10, 90), R(.02, .08)]);
  const col = cv(256, 512, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    g.globalAlpha = .17; g.strokeStyle = "#5a3a1e"; g.lineWidth = 1;
    for (let y = 0; y < h; y += 8) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); for (let x = (y / 8 % 2) * 8; x < w; x += 16) { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 8); g.stroke(); } }
    g.globalAlpha = 1;
    for (const [x, y, a, b, o] of stains) { g.fillStyle = `rgba(60,35,15,${o})`; g.fillRect(x, y, a, b); }
    g.fillStyle = "rgba(0,0,0,.22)"; g.fillRect(0, 0, w, 14);
    g.fillStyle = "rgba(255,240,210,.28)"; for (let f = 0; f < floors; f++) g.fillRect(0, top + f * fh - 5, w, 6);
    for (const [x, y, a, b, on] of plan) archWin(g, x, y, a, b, on || "#151b2c");
  });
  const em = cv(256, 512, (g, w, h) => { g.fillStyle = "#000"; g.fillRect(0, 0, w, h); for (const [x, y, a, b, on] of plan) if (on) archWin(g, x, y, a, b, "#ffb75e", true); });
  return lam({ map: tex(col), emissiveMap: tex(em), emissive: 0xffffff });
}
const facadeMats = WALLS.map((_, i) => facade(i));
const wallMats = WALLS.map(c => lam({ color: c }));
const roofMat = lam({ color: 0x2b2420 });
const groundFloorMat = lam({ color: 0x7a5a3e, emissive: 0x1c1208 });

/* ===== واجهات المحلات ===== */
const SIGNS = ["#173f9e", "#b8261d", "#0f6b45", "#f3c316", "#1d1a2b", "#fbfaf5", "#0e6b78"];
function fitText(g, s, x, y, max, size, font) {
  for (let fs = size; fs > 18; fs -= 2) { g.font = font.replace("#", fs + "px"); if (g.measureText(s).width <= max) break; }
  g.fillText(s, x, y);
}
function shopMat(name, open, big) {
  const bg = big ? "#1d1a2b" : pick(SIGNS);
  const fg = bg === "#f3c316" || bg === "#fbfaf5" ? "#1d1a2b" : bg === "#1d1a2b" ? "#f3c316" : "#fbfaf5";
  const font = big || rnd() < .6 ? "400 # Lalezar" : '700 # "Readex Pro"';
  const goods = []; for (const sy of [140, 186, 232]) for (let x = 34; x < 476;) { const ww = R(5, 13), hh = R(14, 34); if (rnd() < .82) goods.push([x, sy - hh, ww, hh, pick(["#7a4a2a", "#2f5d8a", "#a8332a", "#d9a441", "#3f7a4a", "#e9e1d0"])]); x += ww + R(1, 4); }
  const paint = em => cv(512, 256, (g, w, h) => {
    g.fillStyle = em ? "#000" : "#33251a"; g.fillRect(0, 0, w, h);
    g.fillStyle = bg; g.globalAlpha = em ? .45 : 1; g.fillRect(8, 6, w - 16, 74); g.globalAlpha = 1;
    if (!em) { g.strokeStyle = "rgba(255,255,255,.35)"; g.lineWidth = 3; g.strokeRect(15, 13, w - 30, 60); }
    g.fillStyle = fg; g.textAlign = "center"; g.textBaseline = "middle"; g.direction = "rtl";
    fitText(g, name, w / 2, 46, w - 70, 46, font);
    if (open) {
      if (em) { g.fillStyle = "#b07a35"; g.fillRect(26, 94, w - 52, 162); } else { const gr = g.createLinearGradient(0, 94, 0, 256); gr.addColorStop(0, "#ffe0a6"); gr.addColorStop(1, "#c98c45"); g.fillStyle = gr; g.fillRect(26, 94, w - 52, 162); }
      g.fillStyle = em ? "#000" : "#6a4524"; for (let y = 140; y < 256; y += 46) g.fillRect(26, y, w - 52, 5);
      for (const [x, y, a, b, c] of goods) { g.fillStyle = em ? "#3a2408" : c; g.fillRect(x, y, a, b); }
      if (!em) { g.fillStyle = "#4a3424"; g.fillRect(w / 2 - 3, 94, 6, 162); }
    } else {
      g.fillStyle = em ? "#000" : "#70747b"; g.fillRect(26, 94, w - 52, 162);
      if (!em) { g.fillStyle = "rgba(0,0,0,.28)"; for (let y = 98; y < 256; y += 7) g.fillRect(26, y, w - 52, 2); }
    }
    if (!em) { g.fillStyle = "#4a3424"; g.fillRect(0, 86, 26, h); g.fillRect(w - 26, 86, 26, h); }
  });
  return lam({ map: tex(paint(false)), emissiveMap: tex(paint(true)), emissive: 0xffffff });

    s: "هاي القشلة، بناية من زمن العثمانيين كانت ثكنة ومقر للحكم، وبرج الساعة مالها صار من رموز بغداد. والساعة هنا تمشي على وقت بغداد الحقيقي هسه." },
  { x: -84, z: -120, look: [-92, 4.5, -120], t: "تمثال المتنبي",
    s: "ووصلنا لتمثال المتنبي، نحته الفنان العراقي محمد غني حكمت، ووراه نهر دجلة. هنا تخلص جولتنا. بغداد بيها حچي هواية بعد، ارجع أي وكت ونتمشى سوه." },
];
const done = new Set();

/* ===== حچي نانو (كتابة بس) ===== */
let talk = null;
function say(i) {
  const p = POIS[i]; done.add(i);
  $("stops").innerHTML = `المحطات <b>${done.size}</b>/8`;
  if (talk) stopTalk();
  $("sayT").textContent = "نانو · " + p.t; $("sayP").textContent = "";
  $("nano").classList.add("on", "talk");
  const t = talk = { i, chars: 0, typed: false, spoken: false, until: performance.now() + Math.max(4500, p.s.length * 62) };
}
function stopTalk() { if (!talk) return; talk = null; $("nano").classList.remove("talk"); }
function tickTalk(now) {
  if (!talk) return;
  const p = POIS[talk.i];
  if (!talk.typed) { talk.chars += 1.4; $("sayP").textContent = p.s.slice(0, talk.chars | 0); if (talk.chars >= p.s.length) talk.typed = true; }
  if (talk.typed && (talk.spoken || now > talk.until) && !talk.finishing) {
    talk.finishing = true; $("nano").classList.remove("talk");
    const t = talk; setTimeout(() => { if (talk === t) { talk = null; if (t.i === 7) setTimeout(() => $("end").classList.add("on"), 900); } }, 900);
  }
}
$("skip").onclick = () => { if (!talk) { $("nano").classList.remove("on"); return; } const i = talk.i; $("sayP").textContent = POIS[i].s; stopTalk(); if (i === 7) $("end").classList.add("on"); };

/* ===== راديو بغداد: أغاني قديمة من يوتيوب ===== */
const YT_KEY = "AIzaSyBGHDVChlMSf7pKzUokLAnqZuZRMBE7m08";
const STATIONS = [
  { n: "ياس خضر", q: "ياس خضر اغاني قديمة", ids: ["5GsnliqjjQ4", "GBGSKVTdkE4", "QGOAAMOm7_E", "eR-wk6CPOT4", "P_OxRNRJ3EM"] },
  { n: "ناظم الغزالي", q: "ناظم الغزالي اغاني", ids: ["UHxE0A0-IUc", "vM3t1wyFxuc", "4ohoc4ak1yQ", "83WQtxAuE5Y", "9TxFp2J26_U", "1gOZmUZ1DQc"] },
  { n: "مقام عراقي", q: "مقام عراقي يوسف عمر", ids: ["MONOFBWg6ow", "K0j5_RKNpa0", "gqmLUCF1K3U", "57C9TRPhdb4", "FjTn67Mdpk0", "ny4JVMajMSg", "Vk1NyH-zIGU"] },
  { n: "زهور حسين", q: "زهور حسين اغاني", ids: ["xOz4oL9oRtk", "b63zeZE0S3c", "WzmGq9PdmDU", "TPQ0uNt4JCU", "yq-TMu-ZPkU", "Km09Z579TEA", "cY9LvhgELlY"] },
  { n: "تراث عربي", q: "فيروز اغاني قديمة", ids: ["j9F1G2lpbso", "dLhei4dcFXA", "0uWun4jIWro", "ndjuojYPTco", "gprx8jdCCzs"] },
];
const radio = { st: 0, list: [], i: 0, player: null, ready: false, on: true, vol: 60 };
async function ytSearch(q) {
  const u = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=20&q=${encodeURIComponent(q)}&key=${YT_KEY}`;
  const r = await fetch(u); if (!r.ok) throw new Error("yt " + r.status);
  const ids = (await r.json()).items.map(x => x.id && x.id.videoId).filter(Boolean);
  for (let k = ids.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [ids[k], ids[j]] = [ids[j], ids[k]]; }
  return ids;
}
const rMsg = t => { $("rMsg").textContent = t; $("rMsg").style.display = t ? "grid" : "none"; };
function setStationName() { $("rName").textContent = "راديو بغداد · " + STATIONS[radio.st].n; }
function radioPlaying(p) { $("radio").classList.toggle("play", p); }
function makePlayer(id) {
  radio.player = new YT.Player("ytp", { width: 196, height: 110, videoId: id,
    playerVars: { playsinline: 1, controls: 0, rel: 0, modestbranding: 1, disablekb: 1 },
    events: {
      onReady: () => { radio.ready = true; rMsg(""); radio.player.setVolume(radio.vol); if (started && radio.on) radio.player.playVideo(); },
      onStateChange: e => { radioPlaying(e.data === 1); if (e.data === 1) radio.errs = 0; if (e.data === 0) nextSong(); },
      onError: () => { if (++radio.errs > radio.list.length) return rMsg("هالمحطة ما تشتغل هسه، جرب محطة ثانية"); nextSong(); },
    } });
}
function nextSong() { if (!radio.list.length || !radio.ready) return; rMsg(""); radio.i = (radio.i + 1) % radio.list.length; radio.player.loadVideoById(radio.list[radio.i]); }
async function loadStation(play) {
  setStationName();
  try {
    const stn = STATIONS[radio.st];
    radio.list = await ytSearch(stn.q).catch(() => [...stn.ids].sort(() => Math.random() - .5)); radio.i = 0; radio.errs = 0;
    if (!radio.list.length) return rMsg("ما لگيت أغاني هسه");
    if (!radio.player) { if (window.YT && YT.Player) makePlayer(radio.list[0]); else window.onYouTubeIframeAPIReady = () => makePlayer(radio.list[0]); }
    else if (play) radio.player.loadVideoById(radio.list[0]); else radio.player.cueVideoById(radio.list[0]);
  } catch (e) { rMsg("الراديو ما اشتغل هسه"); }
}
const yts = document.createElement("script"); yts.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(yts);
loadStation(false);
$("rSta").onclick = () => { radio.st = (radio.st + 1) % STATIONS.length; loadStation(true); };
$("rNext").onclick = () => nextSong();
$("radioBtn").onclick = () => {
  radio.on = !radio.on; $("radioBtn").classList.toggle("on", radio.on); $("radio").classList.toggle("off", !radio.on);
  if (radio.ready) radio.on ? radio.player.playVideo() : radio.player.pauseVideo();
};

/* ===== التحكم ===== */
const me = { x: 0, z: 9, yaw: 0, pitch: 0, bob: 0 };
const keys = {}; let joy = null, look = null, started = false;
let auto = false, wp = 0;
const ROUTE = [[0, 5, 0], [0, -34, 1], [0, -76, 2], [-3, -120, 3], [-44, -120, 4], [-73, -117, 5], [-86, -133, 6], [-84, -120, 7]];
function setAuto(on) { auto = on; $("autoBtn").classList.toggle("on", on); if (on) { let best = 0, bd = 1e9; ROUTE.forEach(([x, z, p], k) => { if (done.has(p)) return; const d = Math.hypot(x - me.x, z - me.z); if (d < bd) { bd = d; best = k; } }); wp = best; } }
$("autoBtn").onclick = () => setAuto(!auto);
addEventListener("keydown", e => { keys[e.code] = true; if (/Arrow|Key[WASD]/.test(e.code) && auto) setAuto(false); });
addEventListener("keyup", e => { keys[e.code] = false; });
const cvs = $("c");
cvs.addEventListener("pointerdown", e => {
  if (!started) return;
  if (TOUCH && e.clientX < innerWidth * .5 && e.clientY > innerHeight * .35 && !joy) {
    joy = { id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0 };
    Object.assign($("joy").style, { display: "block", left: e.clientX + "px", top: e.clientY + "px" });
    if (auto) setAuto(false);
  } else if (!look) look = { id: e.pointerId, x: e.clientX, y: e.clientY };
  $("tip").classList.remove("on");
});
addEventListener("pointermove", e => {
  if (joy && e.pointerId === joy.id) {
    let dx = e.clientX - joy.x0, dy = e.clientY - joy.y0; const l = Math.hypot(dx, dy), m = 50;
    if (l > m) { dx *= m / l; dy *= m / l; } joy.dx = dx / m; joy.dy = dy / m;
    $("joy").firstElementChild.style.transform = `translate(${dx}px,${dy}px)`;
  } else if (look && e.pointerId === look.id) {
    me.yaw -= (e.clientX - look.x) * (TOUCH ? .006 : .004); me.pitch -= (e.clientY - look.y) * (TOUCH ? .005 : .0035);
    me.pitch = Math.max(-1.1, Math.min(1.1, me.pitch)); look.x = e.clientX; look.y = e.clientY; lookHold = 2.5;
  }
});
const endPtr = e => {
  if (joy && e.pointerId === joy.id) { joy = null; $("joy").style.display = "none"; $("joy").firstElementChild.style.transform = ""; }
  if (look && e.pointerId === look.id) look = null;
};
addEventListener("pointerup", endPtr); addEventListener("pointercancel", endPtr);
let lookHold = 0;

/* ===== الخريطة الصغيرة ===== */
const mg = $("map").getContext("2d");
const MX = x => (x + 110) / 128 * 200 + 10, MZ = z => (z - 20) / -196 * 280 + 10;
function drawMap() {
  mg.clearRect(0, 0, 220, 300);
  mg.fillStyle = "rgba(201,160,106,.55)";
  for (const [a, b, c, d] of WALK) mg.fillRect(MX(a), MZ(d), MX(b) - MX(a), MZ(c) - MZ(d));
  mg.fillStyle = "rgba(40,80,160,.8)"; mg.fillRect(0, MZ(-60), MX(-106), 300);
  POIS.forEach((p, i) => { mg.beginPath(); mg.arc(MX(p.x), MZ(p.z), 6, 0, 7); mg.fillStyle = done.has(i) ? "#f3c316" : "rgba(251,250,245,.5)"; mg.fill(); });
  mg.save(); mg.translate(MX(me.x), MZ(me.z)); mg.rotate(-me.yaw);
  mg.beginPath(); mg.moveTo(0, -12); mg.lineTo(8, 8); mg.lineTo(0, 4); mg.lineTo(-8, 8); mg.closePath(); mg.fillStyle = "#b8261d"; mg.fill();
  mg.strokeStyle = "#fff"; mg.lineWidth = 2; mg.stroke(); mg.restore();
}

/* ===== الحلقة ===== */
const clock = new THREE.Clock(); let lightT = 0, mapT = 0;
const angTo = (dx, dz) => Math.atan2(-dx, -dz);
const ease = (a, b, k) => { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return a + d * k; };
function step() {
  const dt = Math.min(clock.getDelta(), .05), now = performance.now();
  let mx = 0, mz = 0, moving = false;
  if (started) {
    const f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) + (joy ? -joy.dy : 0);
    const s = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + (joy ? joy.dx : 0);
    if (!TOUCH) me.yaw += ((keys.ArrowLeft ? 1 : 0) - (keys.ArrowRight ? 1 : 0)) * 1.8 * dt;
    const sp = (keys.ShiftLeft ? 6 : 3.4) * dt;
    if (Math.abs(f) + Math.abs(s) > .05) {
      mx = (-Math.sin(me.yaw) * f + Math.cos(me.yaw) * s) * sp; mz = (-Math.cos(me.yaw) * f - Math.sin(me.yaw) * s) * sp;
    }
    if (auto && !talk) {
      const [tx, tz, pi] = ROUTE[wp], dx = tx - me.x, dz = tz - me.z, d = Math.hypot(dx, dz);
      if (d < .6) {
        if (!done.has(pi)) say(pi);
        else if (wp < ROUTE.length - 1) wp++; else setAuto(false);
      } else {
        if (lookHold <= 0) { me.yaw = ease(me.yaw, angTo(dx, dz), Math.min(1, dt * 2.5)); me.pitch += (0 - me.pitch) * Math.min(1, dt * 2); }
        const v = Math.min(d, 2.7 * dt); mx = dx / d * v; mz = dz / d * v;
      }
    }
    if (auto && talk && lookHold <= 0) {
      const [lx, ly, lz] = POIS[talk.i].look, dx = lx - me.x, dz = lz - me.z;
      me.yaw = ease(me.yaw, angTo(dx, dz), Math.min(1, dt * 1.6));
      me.pitch += (Math.atan2(ly - 1.65, Math.hypot(dx, dz)) - me.pitch) * Math.min(1, dt * 1.6);
    }
    lookHold -= dt;
    if (mx || mz) {
      moving = true;
      if (free(me.x + mx, me.z + mz)) { me.x += mx; me.z += mz; }
      else if (free(me.x + mx, me.z)) me.x += mx;
      else if (free(me.x, me.z + mz)) me.z += mz;
    }
    if (!auto) POIS.forEach((p, i) => { if (!done.has(i) && Math.hypot(p.x - me.x, p.z - me.z) < 5) say(i); });
  } else { me.yaw = Math.sin(now / 6000) * .25; }
  me.bob += moving ? dt * 9 : 0;
  camera.position.set(me.x, 1.65 + (moving ? Math.sin(me.bob) * .045 : 0), me.z);
  camera.rotation.set(me.pitch, me.yaw, 0);
  tickTalk(now);
  rip.offset.x += dt * .006; rip.offset.y += dt * .002;
  if ((lightT -= dt) < 0) {
    lightT = .25; const p = camera.position;
    LAMPS.sort((a, b) => a.distanceToSquared(p) - b.distanceToSquared(p)).slice(0, POOL.length).forEach((v, i) => POOL[i].position.copy(v));
  }
  if (started && (mapT -= dt) < 0) { mapT = .1; drawMap(); }
  renderer.render(scene, camera);
  requestAnimationFrame(step);
}
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.fov = fovFor(); camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

function start(withAuto) {
  started = true;
  if (radio.ready && radio.on) { radio.player.setVolume(radio.vol); radio.player.playVideo(); }
  $("intro").classList.add("off"); $("hud").classList.add("on");
  me.yaw = 0; me.pitch = 0;
  if (withAuto) setAuto(true);
  else { $("tip").textContent = TOUCH ? "حرّك إبهامك يسار الشاشة حتى تمشي" : "امشي بالأسهم أو W A S D"; $("tip").classList.add("on"); setTimeout(() => $("tip").classList.remove("on"), 6000); }
}
$("goAuto").onclick = () => start(true);
$("goFree").onclick = () => start(false);
$("again").onclick = () => { $("end").classList.remove("on"); done.clear(); $("stops").innerHTML = "المحطات <b>0</b>/8"; me.x = 0; me.z = 9; me.yaw = 0; me.pitch = 0; $("nano").classList.remove("on"); setAuto(true); };
$("stay").onclick = () => { $("end").classList.remove("on"); $("nano").classList.remove("on"); };

renderer.compile(scene, camera);
$("loading").remove(); $("startBtns").hidden = false;
requestAnimationFrame(step);
window.__bg = { me, camera, done, setAuto, say, scene, THREE };
</script>
